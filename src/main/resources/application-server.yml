spring:
  application:
    name: PET_EYE_SHOP

  # ===============================
  # LOAD ENV FILE
  # ===============================
  config:
    import: optional:file:.env[.properties]

  # ===============================
  # DATABASE (MYSQL)
  # ===============================
  datasource:
    url: jdbc:mysql://localhost:3306/test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8
    username: ${DB_USERNAME:test}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  # ===============================
  # MAIL CONFIG
  # ===============================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ===============================
  # SERVLET / DATA
  # ===============================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 5000ms

# ===============================
# JWT CONFIG (MAP FROM .env)
# ===============================
jwt:
  signer-key: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION}

# ===============================
# SERVER
# ===============================
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api


# ===============================
# LOGGING
# ===============================
logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: OFF
      springframework:
        web: INFO

# ===============================
# Cloudinary CONFIG (MAP FROM .env)
# ===============================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# ===============================
# Goong Map CONFIG (MAP FROM .env)
# ===============================
goong:
  api:
    key: ${GOONG_API_KEY}
  geocode:
    url: https://rsapi.goong.io/Geocode
  distance:
    matrix:
      url: https://rsapi.goong.io/DistanceMatrix

# ===============================
# PayOS CONFIG (MAP FROM .env)
# ===============================
payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  return-url: ${PAYOS_RETURN_URL}
  cancel-url: ${PAYOS_CANCEL_URL}

# ===============================
# SOCIAL CONFIG (MAP FROM .env)
# ===============================
social:
  zalo:
    app-id: ${ZALO_APP_ID}
    app-secret: ${ZALO_APP_SECRET}
  facebook:
    app-id: ${FACEBOOK_APP_ID}
    app-secret: ${FACEBOOK_APP_SECRET}
    redirect-uri: ${FACEBOOK_REDIRECT_URI}

# ===============================
# APP CONFIG
# ===============================
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

# ===============================
# AI GATEWAY CONFIG
# ===============================
ai:
  gemini:
    keys: ${GEMINI_KEY_1:},${GEMINI_KEY_2:},${GEMINI_KEY_3:},${GEMINI_KEY_4:},${GEMINI_KEY_5:}
  memory:
    max-turns: 10
    max-tokens: 8000
  safety:
    max-input-length: 2000

# ===============================
# WALLET CONFIG
# ===============================
wallet:
  admin-fee-rate: 0.10

# ===============================
# CAMERA CONFIG (MAP FROM .env)
# ===============================
camera:
  stream-host: ${CAMERA_STREAM_HOST:localhost}
  kbone:
    sn: ${CAMERA_KBONE_SN}
    stream-url: ${CAMERA_KBONE_STREAM_URL}
