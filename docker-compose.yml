version: '3.8'

services:
  # 1. Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pet_eye_be
    restart: always
    ports:
      - "8080:8080" # Mở cổng ra để Nginx trên Ubuntu kết nối vào API
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=server
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CAMERA_STREAM_HOST=camera
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - peteye-network

  # 2. Cơ sở dữ liệu MySQL
  mysql:
    image: mysql:8.0
    container_name: pet_eye_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - peteye-network

  # 3. Redis
  redis:
    image: redis:7-alpine
    container_name: pet_eye_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - peteye-network

  # 4. Camera Streaming Server
  camera:
    image: bluenviron/mediamtx:latest
    container_name: pet_eye_camera
    restart: always
    ports:
      - "8554:8554"  # RTSP
      - "1935:1935"  # RTMP
      - "8888:8888"  # HLS
      - "8889:8889"  # WebRTC
    networks:
      - peteye-network

volumes:
  mysql_data:
  redis_data:

networks:
  peteye-network:
    driver: bridge
